name: Model quality report
description: Systematic misses or false positives of the NER model on a class of documents, or a benchmark result
labels: ["model"]
body:
  - type: markdown
    attributes:
      value: |
        For a single wrong output use **Bug report**. This form is for patterns: "the model misses diagnoses written in lowercase", "it labels every street name as a surname", or results of running `eval.run` on your own synthetic set.

        **Synthetic examples only.** Every string below must be made up. Real documents, even partially redacted ones, go nowhere near this tracker.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: All examples are synthetic and contain no real personal data.
          required: true
  - type: input
    id: checkpoint
    attributes:
      label: Checkpoint and threshold
      placeholder: emgiezet/piitier (pii-5-v4), --threshold 0.78
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Document domain
      options:
        - insurance (policy, claim, insurer report)
        - banking / lending (agreement, statement)
        - medical (discharge, referral, prescription)
        - customer correspondence / call transcript
        - tabular (CSV, XLSX)
        - other
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: "At least three synthetic snippets with the span the model got wrong marked, e.g. `Rozpoznanie: ⟦zapalenie płuc⟧ (missed, expected ROZPOZNANIE)`."
      render: text
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Numbers, if you have them
      description: Output of `uv run python -m eval.run ...` or your own counts (n documents, misses, false positives). Attach the JSON report rather than pasting documents.
  - type: textarea
    id: hypothesis
    attributes:
      label: Your guess at the cause
      description: Casing, inflection, abbreviations, a document layout not covered by `src/piitier/datagen/templates/`, tokenisation of a specific format.
