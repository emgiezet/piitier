name: Bug report
description: Wrong output, crash, text changed outside a span, or a CLI/API error
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste a real document.** Reproduce with synthetic text (made-up names, a PESEL from a generator, `example.com` addresses). If the bug only shows on a document you cannot share, describe its shape and use the private security advisory instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: The text below is synthetic; it contains no real personal data, client or employer content.
          required: true
  - type: input
    id: version
    attributes:
      label: piitier version
      description: Output of `piitier --version`, or the commit hash for a checkout.
      placeholder: piitier 0.1.1
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - rules only (no --model)
        - rules + NER, local checkpoint
        - rules + NER, Hub id (emgiezet/piitier)
        - Python API
        - TUI (piitier compare)
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: Smallest synthetic text (or file type + structure) that triggers the bug. Exact command or Python call.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Include stderr and the exit code. Error messages name the path, not the content; paste them whole.
      render: text
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of failure
      options:
        - missed PII (false negative, value visible in output)
        - wrong label or placeholder
        - over-masking (false positive)
        - text changed outside a detected span
        - crash or exit code
        - wrong numbering / coreference
        - other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Python 3.12.3, Ubuntu 24.04, CPU / cuda, install via pip or uv sync
