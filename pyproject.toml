[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piitier"
version = "0.1.0"
description = "Polish PII anonymiser for regulated sectors"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "PII Anonymizer Team"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "hypothesis==6.92.1",
    "ruff==0.4.1",
    "mypy==1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring network access",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
