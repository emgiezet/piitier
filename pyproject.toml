[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piitier"
version = "0.1.0"
description = "Polish PII anonymiser for regulated sectors (fintech, insurtech, medtech)"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "faker==40.43.0",
    "morfeusz2==1.99.15",
    "openpyxl==3.1.5",
    "pypdf==6.21.1",
]

[project.scripts]
piitier = "piitier.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/piitier"]

[dependency-groups]
dev = [
    "accelerate==1.15.0",
    "hypothesis==6.170.5",
    "mypy==2.4.0",
    "onnxruntime==1.31.0",
    "onnxscript==0.7.2",
    "optimum==2.3.0",
    "pre-commit==4.7.0",
    "presidio-analyzer==2.2.364",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "seqeval==1.2.2",
    "torch==2.14.1",
    "transformers==5.20.2",
    "types-openpyxl==3.1.5.20261017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that require an installed package or network (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "morfeusz2"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
