[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piitier"
version = "0.1.0"
description = "Polish PII anonymiser for regulated sectors (fintech, insurtech, medtech)"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/piitier"]

[dependency-groups]
dev = [
    "hypothesis==6.170.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require an installed package or network (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
