run: pii-5-v4
base_checkpoint: training/out/pii-5-v4a
base_revision: main
base_license: Apache-2.0
train_file: data/synthetic/v0.3-medical-contrast/train.jsonl
eval_file: data/synthetic/v0.3/dev.jsonl
calibration_file: data/synthetic/v0.3-cal/dev.jsonl
calibration_target_recall: 0.98
calibration_match: strict
calibration_min_support: 100
calibration_device: cuda
calibration_safety_bench: bench/v1/dev
seed: 42
max_steps: 2200
per_device_batch_size: 16
learning_rate: 1.0e-05
max_length: 1024
bf16: true
output_dir: ../out/pii-5-v4
threshold: 0.78
