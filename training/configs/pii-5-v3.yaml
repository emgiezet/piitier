# Run: pii-5-v3 — corpus data/synthetic/v0.3: augmentation on 25% of docs (random transform
# subset), KWOTA/DOCHOD spans include currency, DOCHOD + DANE_ZDROWOTNE generators, slash
# claim/policy numbers, 32 prose templates; whitespace tokens inside entities ignored (-100).
# 19 637 train docs / 16 = 1228 steps per epoch -> max_steps 1300 (~1.06 epoch), lr 1e-5.
# Run: pii-5-v2 — retrain after pii-5-v1 regressed on bench/v1/dev (leak 22/40 vs base 2/40).
# Changes vs v1: corpus data/synthetic/v0.3 built WITHOUT --augment (v0.1 was 100% uppercased,
# diacritics stripped: augment() applied every transform to every doc); token labels fixed
# (leading-space BPE tokens now B-); ~1 epoch (1400 steps) at lr 1e-5 to limit forgetting.
# The v1 notes below (token lengths, launch command, memory probe) still apply.
#
# GPU: RTX 3090 Ti (GPU index 1, 24 GB, bf16).
# Launch command (single-GPU, prevents DataParallel imbalance with the RTX 3080):
#   CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=1 uv run python -m training.train training/configs/pii-5-v1.yaml
#   (without PCI_BUS_ID, CUDA's fastest-first order maps index 1 to the RTX 3080 -> OOM)
#   Probe (30 steps, batch 16 x 1024, bf16): peak 19.4 GB on the 3090 Ti, ~1.3 s/step.
#
# Token-length analysis (bardsai tokenizer, 2000-doc sample, 9 doc types):
#   doc_type                 p50   p90   p99   max
#   mail_klienta             192   198   199   199
#   polisa                   617   800   881   922
#   skierowanie              247   272   277   287
#   transkrypcja_infolinii   292   297   297   297
#   umowa_kredytowa          239   280   284   287
#   wyciag                   334   340   340   340
#   wypis_szpitalny          277   342   348   350
#   zestawienie_prowizyjne   604  1118  1384  1389
#   zgloszenie_szkody        222   251   256   257
#   OVERALL                  281   632  1129  1389
#
# Truncation loss at max_length=1024:
#   docs beyond 1024: 2.5%   spans cut at 1024: 1.9%
# 1.9% of spans cut is ≤ 2% threshold → overlapping windows NOT implemented;
# max_length set to 1024 and loss accepted at < 2%.
#
# bench/v1/dev/docs.jsonl (5 docs) is evaluated separately after training,
# not used as eval_file here (too small for meaningful mid-run eval).
#
# Hyperparameters: 19 637 train docs, batch 16, max_steps 1300 (~1.06 epochs), lr 1e-5.

run: pii-5-v3
base_checkpoint: bardsai/eu-pii-anonimization-multilang-v2
base_revision: "5e61416e77675881185767fc0c67759d48b35592"
base_license: Apache-2.0

train_file: data/synthetic/v0.3/train.jsonl
eval_file: data/synthetic/v0.3/dev.jsonl
# Local historical v0.3 templates include derived policy/table templates (gitignored).
# Restore and assemble them as described in FINDINGS.md, "Rebuild the local calibration split".
# Build: uv run python -m piitier.datagen build --templates data/calibration-templates \
#   --n 9000 --seed 900042 --augment --augment-fraction 0.25 --hard-negatives 900 \
#   --out data/synthetic/v0.3-cal/
# Filter duplicate calibration dev text hashes against v0.3 train/dev and update manifest
# as described in FINDINGS.md (25 zero-gold hard negatives removed in this run).
calibration_file: data/synthetic/v0.3-cal/dev.jsonl
calibration_target_recall: 0.98
calibration_match: strict
calibration_min_support: 100
calibration_device: cuda

seed: 42
max_steps: 1300
per_device_batch_size: 16
learning_rate: 1.0e-5
max_length: 1024
bf16: true

output_dir: ../out/pii-5-v3
